<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPT Simulator — Smart Grid Teleprotection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #e8e6e1; font-family: 'Inter', system-ui, sans-serif; }

        /* ── Loading Screen ── */
        #loading-screen {
            position: fixed; inset: 0;
            background: #2e2c29;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 20px; z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-logo { display: flex; align-items: center; gap: 14px; }
        .loading-logo svg { animation: spin 1.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-title { font-size: 22px; font-weight: 600; color: #f0eeeb; letter-spacing: 2px; }
        .loading-sub { font-size: 12px; color: #888480; letter-spacing: 1.5px; text-transform: uppercase; }
        .loading-bar-wrap { width: 280px; height: 3px; background: #444240; border-radius: 2px; overflow: hidden; }
        .loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4a607a, #6b8aaa); border-radius: 2px; animation: barfill 1.2s ease forwards; }
        @keyframes barfill { to { width: 85%; } }

        /* ── Back button ── */
        .back-btn {
            position: fixed; top: 12px; right: 16px; z-index: 100;
            display: flex; align-items: center; gap: 7px;
            padding: 6px 14px;
            background: rgba(46,44,41,0.92);
            border: 1px solid #444; border-radius: 5px;
            color: #c8c4be; text-decoration: none;
            font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
            backdrop-filter: blur(4px); transition: all 0.15s;
        }
        .back-btn:hover { background: rgba(74,96,122,0.9); border-color: #4a607a; color: #f0eeeb; }

        #root { min-height: 100vh; }
    </style>
</head>
<body>

    <!-- Back to dashboard -->
    <a class="back-btn" href="smart-grid.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Dashboard
    </a>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-logo">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                <circle cx="18" cy="18" r="15" stroke="#4a607a" stroke-width="2" stroke-dasharray="40 55"/>
                <circle cx="18" cy="18" r="9" stroke="#6b8aaa" stroke-width="1.5" stroke-dasharray="20 38"/>
                <circle cx="18" cy="18" r="3.5" fill="#4a607a"/>
            </svg>
            <div>
                <div class="loading-title">TPT SIMULATOR</div>
                <div class="loading-sub">Smart Grid Teleprotection · IEC 60834-1</div>
            </div>
        </div>
        <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
        <div style="font-size:11px;color:#6b6560;letter-spacing:1px">Compilazione JSX in corso…</div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- React 18 + ReactDOM + Babel Standalone via CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

    <!-- Hide loading screen once React mounts -->
    <script>
    (function() {
        // Babel will run synchronously on DOMContentLoaded for text/babel scripts.
        // We listen for the root to have children to hide the loading screen.
        var tries = 0;
        var iv = setInterval(function() {
            tries++;
            var root = document.getElementById('root');
            if ((root && root.children.length > 0) || tries > 60) {
                clearInterval(iv);
                var ls = document.getElementById('loading-screen');
                if (ls) { ls.classList.add('hidden'); setTimeout(function(){ ls.remove(); }, 500); }
            }
        }, 80);
    })();
    </script>

    <!-- TPT Simulation component (inlined JSX — no fetch required) -->
    <script type="text/babel">
var { useState, useEffect, useRef, useCallback } = React;

// ─── PALETTE ──────────────────────────────────────────────────────────────────
const C = {
  bgMain:"#f0eeeb", bgPage:"#e8e6e1", bgCard:"#ffffff", bgHeader:"#2e2c29",
  bgRow:"#f8f7f5", border:"#d6d2cb", text:"#2a2824", textSub:"#6b6560", textMuted:"#a09990",
  ok:"#3d7060", okLight:"#e8f0ed", warn:"#8a6520", warnLight:"#f5ede0",
  alarm:"#8a3030", alarmLight:"#f5e8e8", info:"#3a5f7a", infoLight:"#e8eef3",
  accent:"#4a607a",
  // node colors
  plant:"#4a6741",  plantLight:"#e9f0e8",   // green — generation
  city:"#3a5a7a",   cityLight:"#e5edf5",    // blue  — city load
  industry:"#7a5a30",industryLight:"#f5ede0",// amber — industry load
  flow:"#5a7a6a",   // power-flow dashes
};

const SCHEMES      = { POTT:"POTT", DTT:"DTT", PUTT:"PUTT", BLOCK:"BLOCK" };
const CHAN_TYPES    = { FIBER:"FIBER", PLC:"PLC", RADIO:"RADIO" };
const CHAN_STATUS   = { OK:"OK", DEGRADED:"DEGRADED", FAIL:"FAIL" };
const RELAY_STATES  = { NORMAL:"NORMAL", PICKUP:"PICKUP", TRIP:"TRIP", BLOCK:"BLOCK" };
const BREAKER_STATES= { CLOSED:"CLOSED", OPEN:"OPEN", TRIPPING:"TRIPPING" };

// ─── TOPOLOGY DATA ────────────────────────────────────────────────────────────
// viewBox 0 0 1060 540
const initialSubstations = [
  { id:"SB-A", name:"Nodo 220 kV",  x:260, y:270, voltage:"220kV" },
  { id:"SB-B", name:"Nodo 132 kV",  x:500, y:140, voltage:"132kV" },
  { id:"SB-C", name:"Nodo 132 kV",  x:500, y:400, voltage:"132kV" },
  { id:"SB-D", name:"Nodo 66 kV",   x:740, y:270, voltage:"66kV"  },
];

// Nodi terminali (non hanno TPT/relay propri)
const powerPlant = { id:"GEN-1", name:"Centrale Termoelettrica", x:80,  y:270, type:"plant",    MW:480, fuel:"Gas naturale",  efficiency:42, voltage:"220kV" };
const consumers  = [
  { id:"LOAD-C", name:"Città Metropolitana", x:900, y:400, type:"city",     MW:0, pop:"1.2M ab.",  substationId:"SB-C" },
  { id:"LOAD-D", name:"Polo Industriale",    x:900, y:140, type:"industry", MW:0, sector:"Siderurgia/Chimica", substationId:"SB-D" },
];

const initialTPTs = [
  { id:"TPT-1", substationId:"SB-A", scheme:SCHEMES.POTT,  status:"ACTIVE",  firmware:"v4.2.1", serial:"NK-7740-A1" },
  { id:"TPT-2", substationId:"SB-B", scheme:SCHEMES.POTT,  status:"ACTIVE",  firmware:"v4.2.1", serial:"NK-7740-B2" },
  { id:"TPT-3", substationId:"SB-C", scheme:SCHEMES.DTT,   status:"ACTIVE",  firmware:"v4.1.9", serial:"NK-7740-C3" },
  { id:"TPT-4", substationId:"SB-D", scheme:SCHEMES.POTT,  status:"STANDBY", firmware:"v4.2.1", serial:"NK-7740-D4" },
];
const initialChannels = [
  { id:"CH-1", from:"TPT-1", to:"TPT-2", type:CHAN_TYPES.FIBER, status:CHAN_STATUS.OK, latency:2.1, ber:1e-12, bandwidth:"2Mbit/s"  },
  { id:"CH-2", from:"TPT-2", to:"TPT-3", type:CHAN_TYPES.FIBER, status:CHAN_STATUS.OK, latency:1.8, ber:1e-12, bandwidth:"2Mbit/s"  },
  { id:"CH-3", from:"TPT-1", to:"TPT-3", type:CHAN_TYPES.PLC,   status:CHAN_STATUS.OK, latency:8.5, ber:1e-9,  bandwidth:"600bit/s" },
  { id:"CH-4", from:"TPT-2", to:"TPT-4", type:CHAN_TYPES.FIBER, status:CHAN_STATUS.OK, latency:3.2, ber:1e-12, bandwidth:"2Mbit/s"  },
  { id:"CH-5", from:"TPT-3", to:"TPT-4", type:CHAN_TYPES.RADIO, status:CHAN_STATUS.OK, latency:5.4, ber:1e-8,  bandwidth:"64kbit/s" },
];
const initialRelays = [
  { id:"PR-1A", tptId:"TPT-1", type:"Distance 21",     state:RELAY_STATES.NORMAL, zone:"Z1", current:0, pickup:1200 },
  { id:"PR-2A", tptId:"TPT-2", type:"Distance 21",     state:RELAY_STATES.NORMAL, zone:"Z1", current:0, pickup:1200 },
  { id:"PR-2B", tptId:"TPT-2", type:"Overcurrent 51",  state:RELAY_STATES.NORMAL, zone:"Z2", current:0, pickup:800  },
  { id:"PR-3A", tptId:"TPT-3", type:"Distance 21",     state:RELAY_STATES.NORMAL, zone:"Z1", current:0, pickup:1200 },
  { id:"PR-4A", tptId:"TPT-4", type:"Differential 87", state:RELAY_STATES.NORMAL, zone:"Z1", current:0, pickup:600  },
];
const initialBreakers = [
  { id:"CB-1", substationId:"SB-A", state:BREAKER_STATES.CLOSED, label:"CB-A1" },
  { id:"CB-2", substationId:"SB-B", state:BREAKER_STATES.CLOSED, label:"CB-B1" },
  { id:"CB-3", substationId:"SB-C", state:BREAKER_STATES.CLOSED, label:"CB-C1" },
  { id:"CB-4", substationId:"SB-D", state:BREAKER_STATES.CLOSED, label:"CB-D1" },
];

function ts()          { return new Date().toISOString().replace("T"," ").substring(0,23); }
function rnd(a,b)      { return Math.random()*(b-a)+a; }
function fmt(n,d=0)    { return n.toFixed(d); }

const chanColor  = s => ({ [CHAN_STATUS.OK]:C.ok, [CHAN_STATUS.DEGRADED]:C.warn, [CHAN_STATUS.FAIL]:C.alarm }[s]);
const relayColor = s => ({ [RELAY_STATES.NORMAL]:C.ok, [RELAY_STATES.PICKUP]:C.warn, [RELAY_STATES.TRIP]:C.alarm, [RELAY_STATES.BLOCK]:C.warn }[s]);
const brkColor   = s => ({ [BREAKER_STATES.CLOSED]:C.ok, [BREAKER_STATES.OPEN]:C.alarm, [BREAKER_STATES.TRIPPING]:C.warn }[s]);
const lvlColor   = l => ({ INFO:C.info, WARN:C.warn, ALARM:C.alarm }[l]||C.textMuted);

// ─── SVG ICONS ────────────────────────────────────────────────────────────────
const PlantIcon = ({x,y,active,fault}) => {
  const col = fault?C.alarm:active?C.plant:"#aaa";
  return (
    <g>
      {/* glow */}
      {active&&!fault&&<circle cx={x} cy={y} r="52" fill={C.plant} opacity=".05"/>}
      {fault&&<circle cx={x} cy={y} r="55" fill={C.alarm} opacity=".08" style={{animation:"pulse 1.5s ease-in-out infinite"}}/>}
      {/* building base */}
      <rect x={x-38} y={y-14} width="76" height="32" rx="4" fill={C.bgCard} stroke={col} strokeWidth="1.5"/>
      {/* chimney 1 */}
      <rect x={x-26} y={y-38} width="10" height="26" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      {/* chimney 2 */}
      <rect x={x-6}  y={y-32} width="10" height="20" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      {/* chimney 3 */}
      <rect x={x+14} y={y-42} width="10" height="30" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      {/* smoke puffs */}
      {active&&!fault&&<>
        <circle cx={x-21} cy={y-42} r="4" fill={col} opacity=".15"/>
        <circle cx={x-1}  cy={y-36} r="3" fill={col} opacity=".15"/>
        <circle cx={x+19} cy={y-47} r="5" fill={col} opacity=".12"/>
      </>}
      {/* generator symbol */}
      <circle cx={x+22} cy={y+6} r="8" fill={active?C.plantLight:C.bgRow} stroke={col} strokeWidth="1"/>
      <text x={x+22} y={y+9.5} textAnchor="middle" fill={col} fontSize="8" fontWeight="700">G</text>
      {/* label */}
      <rect x={x-44} y={y+22} width="88" height="28" rx="3" fill={C.bgCard} stroke={col} strokeWidth="1"/>
      <text x={x} y={y+33} textAnchor="middle" fill={col} fontSize="8.5" fontWeight="600">CENTRALE</text>
      <text x={x} y={y+44} textAnchor="middle" fill={col} fontSize="7.5">TERMOELETTRICA</text>
    </g>
  );
};

const CityIcon = ({x,y,active,fault}) => {
  const col = fault?C.alarm:active?C.city:"#aaa";
  return (
    <g>
      {active&&!fault&&<circle cx={x} cy={y} r="52" fill={C.city} opacity=".05"/>}
      {fault&&<circle cx={x} cy={y} r="55" fill={C.alarm} opacity=".08" style={{animation:"pulse 1.5s ease-in-out infinite"}}/>}
      {/* buildings */}
      <rect x={x-36} y={y-28} width="16" height="40" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      <rect x={x-16} y={y-42} width="20" height="54" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      <rect x={x+8}  y={y-32} width="14" height="44" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      <rect x={x+24} y={y-20} width="12" height="32" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      {/* windows */}
      {[-30,-22,-14,-6,2,10,18,26].map((wx,i)=>(
        <rect key={i} x={wx+x} y={y-24+((i%3)*10)} width="4" height="4" rx="1" fill={active&&!fault?col+"44":C.bgRow} stroke={col} strokeWidth=".5"/>
      ))}
      {/* ground */}
      <rect x={x-40} y={y+14} width="80" height="4" rx="2" fill={col} opacity=".3"/>
      {/* label */}
      <rect x={x-40} y={y+22} width="80" height="28" rx="3" fill={C.bgCard} stroke={col} strokeWidth="1"/>
      <text x={x} y={y+33} textAnchor="middle" fill={col} fontSize="8.5" fontWeight="600">CITTÀ</text>
      <text x={x} y={y+44} textAnchor="middle" fill={col} fontSize="7.5">METROPOLITANA</text>
    </g>
  );
};

const IndustryIcon = ({x,y,active,fault}) => {
  const col = fault?C.alarm:active?C.industry:"#aaa";
  return (
    <g>
      {active&&!fault&&<circle cx={x} cy={y} r="52" fill={C.industry} opacity=".05"/>}
      {fault&&<circle cx={x} cy={y} r="55" fill={C.alarm} opacity=".08" style={{animation:"pulse 1.5s ease-in-out infinite"}}/>}
      {/* main hall */}
      <rect x={x-38} y={y-10} width="76" height="28" rx="3" fill={C.bgCard} stroke={col} strokeWidth="1.5"/>
      {/* roof sawtooth */}
      <polyline points={`${x-38},${y-10} ${x-28},${y-26} ${x-18},${y-10} ${x-8},${y-26} ${x+2},${y-10} ${x+12},${y-26} ${x+22},${y-10} ${x+32},${y-26} ${x+38},${y-10}`}
        fill="none" stroke={col} strokeWidth="1.2"/>
      {/* chimney */}
      <rect x={x+20} y={y-40} width="8" height="32" rx="2" fill={C.bgCard} stroke={col} strokeWidth="1.2"/>
      {active&&!fault&&<circle cx={x+24} cy={y-44} r="5" fill={col} opacity=".15"/>}
      {/* gear symbol */}
      <circle cx={x-18} cy={y+6} r="8" fill={active?C.industryLight:C.bgRow} stroke={col} strokeWidth="1"/>
      <text x={x-18} y={y+9.5} textAnchor="middle" fill={col} fontSize="9" fontWeight="700">⚙</text>
      {/* label */}
      <rect x={x-42} y={y+22} width="84" height="28" rx="3" fill={C.bgCard} stroke={col} strokeWidth="1"/>
      <text x={x} y={y+33} textAnchor="middle" fill={col} fontSize="8.5" fontWeight="600">POLO</text>
      <text x={x} y={y+44} textAnchor="middle" fill={col} fontSize="7.5">INDUSTRIALE</text>
    </g>
  );
};

// ─── COMPONENT ────────────────────────────────────────────────────────────────
function TPTSimulation() {
  const [substations]  = useState(initialSubstations);
  const [tpts]         = useState(initialTPTs);
  const [channels,  setChannels]  = useState(initialChannels);
  const [relays,    setRelays]    = useState(initialRelays);
  const [breakers,  setBreakers]  = useState(initialBreakers);

  // Energy telemetry
  const [genMW,    setGenMW]    = useState(powerPlant.MW);
  const [cityMW,   setCityMW]   = useState(210);
  const [industMW, setIndustMW] = useState(180);
  const [flowOffset,setFlowOffset] = useState(0);
  const [genHz,    setGenHz]    = useState(50.0);

  const [events, setEvents] = useState([
    {id:1,time:ts(),level:"INFO",src:"SYSTEM",msg:"Sistema TPT avviato. IEC 60834-1 compliant."},
    {id:2,time:ts(),level:"INFO",src:"GEN-1", msg:"Centrale termoelettrica in produzione nominale — 480 MW @ 220kV."},
    {id:3,time:ts(),level:"INFO",src:"LOAD-C",msg:"Carico città connesso: 210 MW attivi."},
    {id:4,time:ts(),level:"INFO",src:"LOAD-D",msg:"Polo industriale connesso: 180 MW attivi."},
  ]);
  const [signals,      setSignals]      = useState([]);
  const [selectedNode, setSelectedNode] = useState(null);
  const [faultActive,  setFaultActive]  = useState(false);
  const [faultLoc,     setFaultLoc]     = useState("CH-1");
  const [scheme,       setScheme]       = useState(SCHEMES.POTT);
  const [simSpeed,     setSimSpeed]     = useState(1);
  const [activeTab,    setActiveTab]    = useState("topology");
  const [ticker,       setTicker]       = useState(0);
  const [faultStep,    setFaultStep]    = useState(-1);
  const eid = useRef(5);

  const addEvent = useCallback((level,src,msg)=>
    setEvents(p=>[{id:eid.current++,time:ts(),level,src,msg},...p].slice(0,300))
  ,[]);

  // Main telemetry ticker
  useEffect(()=>{
    const id=setInterval(()=>{
      setTicker(t=>t+1);
      setFlowOffset(o=>(o+2)%40);
      // gen jitter
      setGenMW(v=>Math.max(300,Math.min(600,+(v+rnd(-4,4)).toFixed(1))));
      setCityMW(v=>Math.max(80,Math.min(300,+(v+rnd(-3,3)).toFixed(1))));
      setIndustMW(v=>Math.max(60,Math.min(260,+(v+rnd(-2,2)).toFixed(1))));
      setGenHz(v=>Math.max(49.5,Math.min(50.5,+(v+rnd(-0.05,0.05)).toFixed(2))));
      setChannels(p=>p.map(ch=>ch.status===CHAN_STATUS.FAIL?ch:{...ch,latency:Math.max(0.5,+(ch.latency+rnd(-0.3,0.3)).toFixed(1))}));
      setRelays(p=>p.map(r=>r.state!==RELAY_STATES.NORMAL?r:{...r,current:+rnd(50,200).toFixed(0)}));
    },1000/simSpeed);
    return ()=>clearInterval(id);
  },[simSpeed]);

  // Signal animation
  useEffect(()=>{
    const id=setInterval(()=>setSignals(p=>p.map(s=>({...s,progress:s.progress+0.05})).filter(s=>s.progress<1.05)),50);
    return ()=>clearInterval(id);
  },[]);

  const sendSig = useCallback((from,to,type,color)=>
    setSignals(p=>[...p,{id:Math.random(),from,to,type,color,progress:0}]),[]);

  const injectFault = useCallback(()=>{
    if(faultActive) return;
    setFaultActive(true);
    setFaultStep(0);
    addEvent("ALARM","SISTEMA",`⚡ GUASTO INIETTATO su ${faultLoc} — Schema: ${scheme}`);
    setTimeout(()=>{
      setFaultStep(1);
      addEvent("ALARM","PR-1A","Relay distanza PICKUP — corrente di cortocircuito rilevata Z1/Z2");
      setRelays(p=>p.map(r=>r.id==="PR-1A"?{...r,state:RELAY_STATES.PICKUP,current:+rnd(2200,3500).toFixed(0)}:r));
    },200/simSpeed);
    setTimeout(()=>{
      setFaultStep(2);
      const [t,col]=scheme===SCHEMES.POTT?["PERM",C.ok]:scheme===SCHEMES.DTT?["DTT",C.alarm]:scheme===SCHEMES.PUTT?["PUTT",C.warn]:["BLK",C.textSub];
      addEvent("INFO","TPT-1",`${scheme}: Invio segnale ${t} su CH-1 (IEC 60834)`);
      sendSig("TPT-1","TPT-2",t,col);
    },600/simSpeed);
    setTimeout(()=>{
      setFaultStep(3);
      addEvent("ALARM","PR-2A",`Relay riceve segnale ${scheme} — avvio procedura TRIP`);
      setRelays(p=>p.map(r=>["PR-1A","PR-2A"].includes(r.id)?{...r,state:RELAY_STATES.TRIP,current:0}:r));
      sendSig("TPT-1","TPT-3","TRIP",C.alarm);
      sendSig("TPT-2","TPT-4","TRIP",C.alarm);
    },1200/simSpeed);
    setTimeout(()=>{
      setFaultStep(4);
      addEvent("ALARM","CB-A1","INTERRUTTORE APERTO — linea de-energizzata");
      addEvent("ALARM","CB-B1","INTERRUTTORE APERTO — linea de-energizzata");
      setBreakers(p=>p.map(b=>["CB-1","CB-2"].includes(b.id)?{...b,state:BREAKER_STATES.TRIPPING}:b));
      addEvent("ALARM","LOAD-C","⚠ Interruzione parziale fornitura — Città in deficit +45 MW");
      addEvent("ALARM","LOAD-D","⚠ Polo industriale in modalità riduzione carico");
    },1600/simSpeed);
    setTimeout(()=>{
      setFaultStep(5);
      setBreakers(p=>p.map(b=>["CB-1","CB-2"].includes(b.id)?{...b,state:BREAKER_STATES.OPEN}:b));
      addEvent("INFO","SISTEMA","✅ Guasto isolato. Tempo totale intervento: ~85ms");
    },2000/simSpeed);
    if(faultLoc.startsWith("CH")){
      setTimeout(()=>{
        addEvent("WARN",faultLoc,"Canale degradato — BER elevato rilevato");
        setChannels(p=>p.map(ch=>ch.id===faultLoc?{...ch,status:CHAN_STATUS.DEGRADED,latency:+(ch.latency*3).toFixed(1)}:ch));
      },500/simSpeed);
    }
  },[faultActive,faultLoc,scheme,simSpeed,addEvent,sendSig]);

  const resetSystem = useCallback(()=>{
    setFaultActive(false);
    setFaultStep(-1);
    setRelays(initialRelays.map(r=>({...r,current:+rnd(50,200).toFixed(0)})));
    setBreakers(initialBreakers);
    setChannels(initialChannels.map(ch=>({...ch,latency:+(ch.latency+rnd(-0.2,0.2)).toFixed(1)})));
    setSignals([]);
    setGenMW(480); setCityMW(210); setIndustMW(180);
    addEvent("INFO","SISTEMA","🔄 Sistema ripristinato — tutti i dispositivi in stato NORMAL");
    addEvent("INFO","GEN-1","Produzione nominale ripristinata: 480 MW");
  },[addEvent]);

  const toggleChan = useCallback((chId)=>{
    setChannels(p=>p.map(ch=>{
      if(ch.id!==chId) return ch;
      const ns=ch.status===CHAN_STATUS.FAIL?CHAN_STATUS.OK:CHAN_STATUS.FAIL;
      addEvent(ns===CHAN_STATUS.FAIL?"ALARM":"INFO",chId,`Canale ${chId} ${ns===CHAN_STATUS.FAIL?"DISATTIVATO":"RIPRISTINATO"}`);
      return {...ch,status:ns,latency:ns===CHAN_STATUS.FAIL?0:initialChannels.find(c=>c.id===chId).latency};
    }));
  },[addEvent]);

  // Sub positions lookup
  const subPos = id => {
    const s=substations.find(x=>x.id===id);
    return s?{x:s.x,y:s.y}:{x:0,y:0};
  };
  const tptPos = id => {
    const t=tpts.find(x=>x.id===id);
    return t?subPos(t.substationId):{x:0,y:0};
  };
  const sigPos = sig=>{ const f=tptPos(sig.from),t=tptPos(sig.to); return{x:f.x+(t.x-f.x)*sig.progress,y:f.y+(t.y-f.y)*sig.progress}; };

  // Power line positions (for main grid visualization)
  const powerLines = [
    {id:"PL-GEN", from:{x:powerPlant.x+44,y:powerPlant.y}, to:{x:260,y:270}, label:"220kV", active:true, MW:genMW},
    {id:"PL-AB",  from:{x:260,y:270}, to:{x:500,y:140}, label:"132kV", active:true, MW:+(genMW*0.52).toFixed(0)},
    {id:"PL-AC",  from:{x:260,y:270}, to:{x:500,y:400}, label:"132kV", active:true, MW:+(genMW*0.46).toFixed(0)},
    {id:"PL-BD",  from:{x:500,y:140}, to:{x:740,y:270}, label:"66kV",  active:true, MW:+(industMW*1.05).toFixed(0)},
    {id:"PL-CD",  from:{x:500,y:400}, to:{x:740,y:270}, label:"66kV",  active:true, MW:+(cityMW*0.4).toFixed(0)},
    {id:"PL-CITY",from:{x:740,y:270}, to:{x:900,y:400}, label:"20kV",  active:!faultActive, MW:cityMW},
    {id:"PL-IND", from:{x:740,y:270}, to:{x:900,y:140}, label:"20kV",  active:!faultActive, MW:industMW},
  ];

  const balance = genMW - cityMW - industMW;
  const freqOk  = Math.abs(genHz-50)<0.2;

  // Shared styles
  const card = { background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:"6px", padding:"14px" };
  const badge = col=>({ background:col+"18", border:`1px solid ${col}55`, color:col, padding:"2px 10px", borderRadius:"3px", fontSize:"11px", display:"inline-block" });
  const sLbl  = { fontSize:"10px", color:C.textMuted, fontWeight:600, textTransform:"uppercase", letterSpacing:"1px", marginBottom:"8px" };

  return (
    <div style={{background:C.bgPage,color:C.text,fontFamily:"'Inter','Segoe UI',system-ui,sans-serif",minHeight:"100vh",display:"flex",flexDirection:"column",fontSize:"13px"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        *{box-sizing:border-box}
        ::-webkit-scrollbar{width:5px;background:${C.bgPage}}
        ::-webkit-scrollbar-thumb{background:${C.border};border-radius:3px}
        .blink{animation:blink .7s step-end infinite}
        .pulse{animation:pulse 1.8s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;
          color:${C.textMuted};cursor:pointer;padding:10px 18px;
          font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.5px;
          transition:all .15s;text-transform:uppercase}
        .tab-btn:hover{color:${C.text}}
        .tab-btn.active{color:${C.accent};border-bottom-color:${C.accent}}
        .ctrl-btn{background:${C.bgCard};border:1px solid ${C.border};color:${C.textSub};
          cursor:pointer;padding:6px 14px;font-family:inherit;font-size:12px;
          border-radius:4px;transition:all .15s}
        .ctrl-btn:hover:not(:disabled){border-color:${C.accent};color:${C.accent};background:${C.infoLight}}
        .ctrl-btn:disabled{opacity:.4;cursor:not-allowed}
        .ctrl-btn.danger{border-color:${C.alarm}55;color:${C.alarm}}
        .ctrl-btn.danger:hover:not(:disabled){background:${C.alarmLight};border-color:${C.alarm}}
        .ctrl-btn.success{border-color:${C.ok}55;color:${C.ok}}
        .ctrl-btn.success:hover:not(:disabled){background:${C.okLight};border-color:${C.ok}}
        .sel{background:${C.bgCard};border:1px solid ${C.border};color:${C.text};
          padding:5px 10px;font-family:inherit;font-size:12px;border-radius:4px}
        .sel:focus{outline:none;border-color:${C.accent}}
        .dr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid ${C.bgRow};font-size:12px}
        .dr:last-child{border-bottom:none}
        .dr span:first-child{color:${C.textSub}}
        .node-hover{cursor:pointer}
        svg text{font-family:'Inter',system-ui,sans-serif}
      `}</style>

      {/* HEADER */}
      <div style={{background:C.bgHeader,padding:"12px 24px",display:"flex",alignItems:"center",gap:"20px"}}>
        <div>
          <div style={{fontWeight:600,fontSize:"16px",color:"#f0eeeb",letterSpacing:"1px"}}>TPT MONITOR</div>
          <div style={{fontSize:"10px",color:"#888480",letterSpacing:"1px",marginTop:"1px"}}>SMART GRID TELEPROTECTION · IEC 60834-1 / IEC 61850</div>
        </div>
        <div style={{flex:1}}/>
        {/* KPI cards */}
        {[
          {label:"Produzione",  val:`${fmt(genMW,0)} MW`,    color:C.plant   },
          {label:"Carico Città",val:`${fmt(cityMW,0)} MW`,   color:C.city    },
          {label:"Industria",   val:`${fmt(industMW,0)} MW`, color:C.industry},
          {label:"Bilancio",    val:`${balance>=0?"+":""}${fmt(balance,0)} MW`, color:balance>=0?C.ok:C.alarm},
          {label:"Freq. Rete",  val:`${fmt(genHz,2)} Hz`,    color:freqOk?C.ok:C.warn},
          {label:"Canali OK",   val:`${channels.filter(c=>c.status===CHAN_STATUS.OK).length}/${channels.length}`, color:C.ok},
          {label:"Relay Trip",  val:relays.filter(r=>r.state===RELAY_STATES.TRIP).length, color:C.alarm},
        ].map(({label,val,color})=>(
          <div key={label} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"5px",padding:"6px 14px",textAlign:"center",minWidth:"88px"}}>
            <div style={{fontSize:"14px",fontWeight:600,color,lineHeight:1}}>{val}</div>
            <div style={{fontSize:"9px",color:"#888480",letterSpacing:"1px",marginTop:"3px",textTransform:"uppercase"}}>{label}</div>
          </div>
        ))}
        <div style={{fontSize:"11px",color:"#888480",textAlign:"right",marginLeft:"4px"}}>
          <div style={{color:"#c8c4be"}}>{new Date().toLocaleTimeString()}</div>
          <div>{new Date().toLocaleDateString("it-IT")}</div>
        </div>
      </div>

      {/* CONTROLS */}
      <div style={{background:C.bgMain,borderBottom:`1px solid ${C.border}`,padding:"8px 24px",display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
        <span style={{fontSize:"11px",color:C.textMuted,fontWeight:500,textTransform:"uppercase",letterSpacing:".5px"}}>Schema</span>
        <select className="sel" value={scheme} onChange={e=>setScheme(e.target.value)}>
          <option value={SCHEMES.POTT}>POTT — Permissive Overreaching Transfer Trip</option>
          <option value={SCHEMES.DTT}>DTT — Direct Transfer Trip</option>
          <option value={SCHEMES.PUTT}>PUTT — Permissive Underreaching Transfer Trip</option>
          <option value={SCHEMES.BLOCK}>BLOCK — Blocking Scheme</option>
        </select>
        <span style={{fontSize:"11px",color:C.textMuted,fontWeight:500,textTransform:"uppercase",letterSpacing:".5px"}}>Guasto su</span>
        <select className="sel" value={faultLoc} onChange={e=>setFaultLoc(e.target.value)}>
          {channels.map(ch=><option key={ch.id} value={ch.id}>{ch.id}: {ch.from}↔{ch.to} ({ch.type})</option>)}
          <option value="SB-B">Sbarra 132kV (cortocircuito)</option>
          <option value="SB-D">Sbarra 66kV (cortocircuito)</option>
        </select>
        <span style={{fontSize:"11px",color:C.textMuted,fontWeight:500,textTransform:"uppercase",letterSpacing:".5px"}}>Velocità</span>
        <select className="sel" value={simSpeed} onChange={e=>setSimSpeed(+e.target.value)}>
          <option value={0.5}>0.5× lenta</option><option value={1}>1× normale</option>
          <option value={2}>2× rapida</option><option value={5}>5× turbo</option>
        </select>
        <div style={{flex:1}}/>
        <button className="ctrl-btn danger" onClick={injectFault} disabled={faultActive}>⚡ Inietta Guasto</button>
        <button className="ctrl-btn success" onClick={resetSystem}>↺ Reset Sistema</button>
      </div>

      {/* TABS */}
      <div style={{background:C.bgMain,borderBottom:`1px solid ${C.border}`,padding:"0 24px",display:"flex"}}>
        {[["topology","Topologia"],["energy","Bilancio Energetico"],["tpts","Unità TPT"],["channels","Canali"],["relays","Relay"],["events","Log"],["faultdesc","Analisi Guasto"]].map(([id,lbl])=>(
          <button key={id} className={`tab-btn ${activeTab===id?"active":""}`} onClick={()=>setActiveTab(id)}>{lbl}</button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{flex:1,overflow:"auto",padding:"20px 24px"}}>

        {/* ═══ TOPOLOGY ═══ */}
        {activeTab==="topology"&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 290px",gap:"18px"}}>
            <div style={card}>
              <div style={sLbl}>Schema Unifilare — Smart Grid Completo</div>
              <svg width="100%" viewBox="0 0 1060 540" style={{display:"block"}}>
                <defs>
                  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M40 0L0 0 0 40" fill="none" stroke={C.bgPage} strokeWidth="1"/>
                  </pattern>
                  <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 Z" fill={C.flow} opacity=".5"/>
                  </marker>
                </defs>
                <rect width="1060" height="540" fill={C.bgRow} rx="4"/>
                <rect width="1060" height="540" fill="url(#grid)" rx="4"/>

                {/* ── POWER LINES (background, thicker) ── */}
                {powerLines.map(pl=>{
                  const active = pl.active && !faultActive;
                  const faultLine = faultActive && (pl.id==="PL-CITY"||pl.id==="PL-IND");
                  const lineCol = faultLine?C.alarm:active?C.flow:C.textMuted;
                  const dx=pl.to.x-pl.from.x, dy=pl.to.y-pl.from.y;
                  const len=Math.sqrt(dx*dx+dy*dy);
                  const mx=(pl.from.x+pl.to.x)/2, my=(pl.from.y+pl.to.y)/2;
                  return (
                    <g key={pl.id}>
                      {/* glow */}
                      <line x1={pl.from.x} y1={pl.from.y} x2={pl.to.x} y2={pl.to.y}
                        stroke={lineCol} strokeWidth="10" strokeOpacity=".06"/>
                      {/* main line */}
                      <line x1={pl.from.x} y1={pl.from.y} x2={pl.to.x} y2={pl.to.y}
                        stroke={lineCol} strokeWidth="2" strokeOpacity={active?".7":".25"}/>
                      {/* animated flow dashes */}
                      {active&&<line x1={pl.from.x} y1={pl.from.y} x2={pl.to.x} y2={pl.to.y}
                        stroke={lineCol} strokeWidth="2.5" strokeOpacity=".5"
                        strokeDasharray="12,20"
                        strokeDashoffset={-flowOffset}/>}
                      {/* MW label */}
                      <rect x={mx-22} y={my-9} width="44" height="16" rx="3" fill={C.bgCard} stroke={lineCol} strokeWidth=".8" opacity=".95"/>
                      <text x={mx} y={my+3.5} textAnchor="middle" fill={lineCol} fontSize="8.5" fontWeight="500">{pl.MW} MW</text>
                    </g>
                  );
                })}

                {/* ── TELEPROTECTION CHANNELS (on top of power lines) ── */}
                {channels.map(ch=>{
                  const f=tptPos(ch.from), t=tptPos(ch.to);
                  const col=chanColor(ch.status);
                  const mx=(f.x+t.x)/2, my=(f.y+t.y)/2-18;
                  const dash=ch.type===CHAN_TYPES.PLC?"8,4":ch.type===CHAN_TYPES.RADIO?"4,4":"none";
                  return (
                    <g key={ch.id} className="node-hover" onClick={()=>setSelectedNode({type:"channel",data:ch})}>
                      <line x1={f.x} y1={f.y} x2={t.x} y2={t.y}
                        stroke={col} strokeWidth="1.5" strokeOpacity=".7" strokeDasharray={dash}
                        strokeLinecap="round"/>
                      <rect x={mx-26} y={my-8} width="52" height="15" rx="3" fill={C.bgCard} stroke={col} strokeWidth=".8" opacity=".95"/>
                      <text x={mx} y={my+3.5} textAnchor="middle" fill={col} fontSize="8" fontWeight="500">{ch.id} {ch.latency}ms</text>
                    </g>
                  );
                })}

                {/* ── SIGNAL PARTICLES ── */}
                {signals.map(sig=>{
                  const p=sigPos(sig);
                  return <g key={sig.id}>
                    <circle cx={p.x} cy={p.y} r="10" fill={sig.color} opacity=".1"/>
                    <circle cx={p.x} cy={p.y} r="5"  fill={sig.color} opacity=".9"/>
                    <text x={p.x+12} y={p.y-5} fill={sig.color} fontSize="9" fontWeight="600">{sig.type}</text>
                  </g>;
                })}

                {/* ── SUBSTATIONS ── */}
                {substations.map(sub=>{
                  const tpt=tpts.find(t=>t.substationId===sub.id);
                  const relay=relays.find(r=>r.tptId===tpt?.id);
                  const brk=breakers.find(b=>b.substationId===sub.id);
                  const isSel=selectedNode?.data?.id===sub.id||selectedNode?.data?.substationId===sub.id;
                  const hasTrip=relay?.state===RELAY_STATES.TRIP;
                  const cbCol=brkColor(brk?.state||BREAKER_STATES.CLOSED);
                  return <g key={sub.id} className="node-hover" onClick={()=>setSelectedNode({type:"substation",data:{sub,tpt,relay,brk}})}>
                    {isSel&&<rect x={sub.x-58} y={sub.y-38} width="116" height="76" rx="8" fill={C.accent} opacity=".06"/>}
                    {hasTrip&&<rect x={sub.x-60} y={sub.y-40} width="120" height="80" rx="8" fill={C.alarm} opacity=".06" className="pulse"/>}
                    <rect x={sub.x-54} y={sub.y-34} width="108" height="68" rx="5"
                      fill={C.bgCard} stroke={hasTrip?C.alarm:isSel?C.accent:C.border} strokeWidth={hasTrip||isSel?1.5:1}/>
                    <rect x={sub.x-54} y={sub.y-34} width="108" height="16" rx="5" fill={hasTrip?C.alarmLight:C.bgRow}/>
                    <text x={sub.x} y={sub.y-22} textAnchor="middle" fill={hasTrip?C.alarm:C.accent} fontSize="9.5" fontWeight="600">
                      {sub.voltage} · {sub.id}
                    </text>
                    <text x={sub.x} y={sub.y-7} textAnchor="middle" fill={C.textSub} fontSize="8.5">{sub.name}</text>
                    {tpt&&<g>
                      <rect x={sub.x-32} y={sub.y+4} width="64" height="14" rx="3"
                        fill={tpt.status==="ACTIVE"?C.okLight:C.warnLight} stroke={(tpt.status==="ACTIVE"?C.ok:C.warn)+"55"}/>
                      <text x={sub.x} y={sub.y+14} textAnchor="middle" fill={tpt.status==="ACTIVE"?C.ok:C.warn} fontSize="8.5" fontWeight="500">
                        {tpt.id} {tpt.status==="ACTIVE"?"●":"○"}
                      </text>
                    </g>}
                    {brk&&<g>
                      <rect x={sub.x+36} y={sub.y-46} width="18" height="18" rx="3"
                        fill={cbCol+"18"} stroke={cbCol} strokeWidth="1.2"
                        className={brk.state===BREAKER_STATES.TRIPPING?"blink":""}/>
                      <text x={sub.x+45} y={sub.y-34} textAnchor="middle" fill={cbCol} fontSize="9">
                        {brk.state===BREAKER_STATES.CLOSED?"▬":brk.state===BREAKER_STATES.TRIPPING?"⚡":"⊘"}
                      </text>
                      <text x={sub.x+45} y={sub.y-54} textAnchor="middle" fill={C.textMuted} fontSize="8">{brk.label}</text>
                    </g>}
                    {relay&&relay.state!==RELAY_STATES.NORMAL&&<g>
                      <rect x={sub.x-54} y={sub.y+22} width="108" height="13" rx="3"
                        fill={relayColor(relay.state)+"18"} stroke={relayColor(relay.state)} strokeWidth=".8" className="blink"/>
                      <text x={sub.x} y={sub.y+31} textAnchor="middle" fill={relayColor(relay.state)} fontSize="8.5" fontWeight="600">
                        ⚠ {relay.state} — {relay.type}
                      </text>
                    </g>}
                  </g>;
                })}

                {/* ── POWER PLANT ── */}
                <g className="node-hover" onClick={()=>setSelectedNode({type:"plant",data:powerPlant})}>
                  <PlantIcon x={powerPlant.x} y={powerPlant.y} active={!faultActive} fault={faultActive&&false}/>
                </g>

                {/* ── CONSUMERS ── */}
                {consumers.map(c=>(
                  <g key={c.id} className="node-hover" onClick={()=>setSelectedNode({type:"consumer",data:c})}>
                    {c.type==="city"
                      ? <CityIcon     x={c.x} y={c.y} active={!faultActive} fault={faultActive}/>
                      : <IndustryIcon x={c.x} y={c.y} active={!faultActive} fault={faultActive}/>
                    }
                  </g>
                ))}

                {/* ── LEGEND ── */}
                <g transform="translate(16,500)">
                  {[
                    ["──",C.flow,    "Flusso potenza"],
                    ["─ ─",C.ok,    "Canale fibra OK"],
                    ["· ·",C.ok,    "PLC/Radio OK"],
                    ["●",C.ok,      "OK"],
                    ["●",C.warn,    "Degradato"],
                    ["●",C.alarm,   "Guasto/Trip"],
                    ["▬",C.plant,   "Centrale"],
                    ["⚙",C.city,    "Utenza"],
                  ].map(([sym,col,lbl],i)=>(
                    <g key={i} transform={`translate(${i*118},0)`}>
                      <text x="0" y="0" fill={col} fontSize="11">{sym}</text>
                      <text x="24" y="0" fill={C.textMuted} fontSize="9">{lbl}</text>
                    </g>
                  ))}
                </g>
              </svg>
            </div>

            {/* Detail panel */}
            <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
              {/* Selected node details */}
              {selectedNode?(
                <div style={card}>
                  <div style={sLbl}>Dettaglio — {selectedNode.type}</div>
                  {selectedNode.type==="plant"&&<>
                    <div className="dr"><span>ID</span><span style={{color:C.plant,fontWeight:500}}>{selectedNode.data.id}</span></div>
                    <div className="dr"><span>Nome</span><span>{selectedNode.data.name}</span></div>
                    <div className="dr"><span>Tipo combustibile</span><span>{selectedNode.data.fuel}</span></div>
                    <div className="dr"><span>Potenza nominale</span><span style={{color:C.plant,fontWeight:500}}>{selectedNode.data.MW} MW</span></div>
                    <div className="dr"><span>Produzione attuale</span><span style={{color:C.plant,fontWeight:500}}>{fmt(genMW,0)} MW</span></div>
                    <div className="dr"><span>Efficienza</span><span>{selectedNode.data.efficiency}%</span></div>
                    <div className="dr"><span>Tensione uscita</span><span>{selectedNode.data.voltage}</span></div>
                    <div className="dr"><span>Frequenza rete</span><span style={{color:freqOk?C.ok:C.warn}}>{fmt(genHz,2)} Hz</span></div>
                  </>}
                  {selectedNode.type==="consumer"&&<>
                    <div className="dr"><span>ID</span><span style={{color:selectedNode.data.type==="city"?C.city:C.industry,fontWeight:500}}>{selectedNode.data.id}</span></div>
                    <div className="dr"><span>Nome</span><span>{selectedNode.data.name}</span></div>
                    {selectedNode.data.type==="city"&&<div className="dr"><span>Popolazione</span><span>{selectedNode.data.pop}</span></div>}
                    {selectedNode.data.type==="industry"&&<div className="dr"><span>Settore</span><span>{selectedNode.data.sector}</span></div>}
                    <div className="dr"><span>Sottostazione</span><span style={{color:C.accent}}>{selectedNode.data.substationId}</span></div>
                    <div className="dr"><span>Consumo attuale</span>
                      <span style={{color:selectedNode.data.type==="city"?C.city:C.industry,fontWeight:500}}>
                        {selectedNode.data.type==="city"?fmt(cityMW,0):fmt(industMW,0)} MW
                      </span>
                    </div>
                    <div className="dr"><span>Stato fornitura</span>
                      <span style={{color:faultActive?C.alarm:C.ok}}>{faultActive?"INTERROTTA":"REGOLARE"}</span>
                    </div>
                  </>}
                  {selectedNode.type==="substation"&&<>
                    <div className="dr"><span>Sottostazione</span><span style={{color:C.accent,fontWeight:500}}>{selectedNode.data.sub.id}</span></div>
                    <div className="dr"><span>Tensione</span><span>{selectedNode.data.sub.voltage}</span></div>
                    {selectedNode.data.tpt&&<>
                      <div style={{height:"4px"}}/>
                      <div className="dr"><span>TPT</span><span style={{color:C.accent,fontWeight:500}}>{selectedNode.data.tpt.id}</span></div>
                      <div className="dr"><span>Schema</span><span>{selectedNode.data.tpt.scheme}</span></div>
                      <div className="dr"><span>Stato</span><span style={{color:selectedNode.data.tpt.status==="ACTIVE"?C.ok:C.warn}}>{selectedNode.data.tpt.status}</span></div>
                    </>}
                    {selectedNode.data.relay&&<>
                      <div style={{height:"4px"}}/>
                      <div className="dr"><span>Relay</span><span>{selectedNode.data.relay.type}</span></div>
                      <div className="dr"><span>Stato</span><span style={{color:relayColor(selectedNode.data.relay.state)}}>{selectedNode.data.relay.state}</span></div>
                      <div className="dr"><span>Corrente</span><span>{selectedNode.data.relay.current} A</span></div>
                    </>}
                    {selectedNode.data.brk&&<>
                      <div style={{height:"4px"}}/>
                      <div className="dr"><span>Interruttore</span><span>{selectedNode.data.brk.label}</span></div>
                      <div className="dr"><span>Stato CB</span><span style={{color:brkColor(selectedNode.data.brk.state)}}>{selectedNode.data.brk.state}</span></div>
                    </>}
                  </>}
                  {selectedNode.type==="channel"&&<>
                    <div className="dr"><span>Canale</span><span style={{color:C.accent,fontWeight:500}}>{selectedNode.data.id}</span></div>
                    <div className="dr"><span>Tipo</span><span>{selectedNode.data.type}</span></div>
                    <div className="dr"><span>Stato</span><span style={{color:chanColor(selectedNode.data.status)}}>{selectedNode.data.status}</span></div>
                    <div className="dr"><span>Latenza</span><span>{selectedNode.data.latency} ms</span></div>
                    <div className="dr"><span>BER</span><span>{selectedNode.data.ber?.toExponential(0)}</span></div>

              <div style={{background:C.bgRow,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"14px",fontFamily:"'JetBrains Mono','Courier New',monospace",fontSize:"11px",lineHeight:"1.85",color:C.textSub}}>
                <span style={{color:C.textMuted}}>PDU:</span> <span style={{color:C.accent,fontWeight:500}}>GoosePdu</span>{" {"}<br/>
                {"  "}<span style={{color:C.warn}}>gocbRef</span>: <span style={{color:C.alarm}}>"IED1/LLN0$GO$gcbTripSignal"</span><br/>
                {"  "}<span style={{color:C.warn}}>t</span>: <span style={{color:C.text}}>{new Date().toISOString()}</span><br/>
                {"  "}<span style={{color:C.warn}}>stNum</span>: <span style={{color:C.text}}>{ticker+1}</span><br/>
                {"  "}<span style={{color:C.warn}}>sqNum</span>: <span style={{color:C.text}}>{ticker*7+42}</span><br/>
                {"  "}<span style={{color:C.warn}}>simulation</span>: <span style={{color:C.text}}>TRUE</span><br/>
                {"  "}<span style={{color:C.warn}}>allData</span>: {"["}<br/>
                {"    "}BOOLEAN <span style={{color:faultActive?C.alarm:C.ok,fontWeight:500}}>{faultActive?"TRUE":"FALSE"}</span> -- TripSignal<br/>
                {"    "}REAL <span style={{color:C.text}}>{fmt(genMW,1)}</span> -- GenMW<br/>
                {"    "}REAL <span style={{color:C.text}}>{fmt(cityMW+industMW,1)}</span> -- LoadMW<br/>
                {"    "}REAL <span style={{color:freqOk?C.ok:C.warn}}>{fmt(genHz,3)}</span> -- FreqHz<br/>
                {"    "}QUALITY <span style={{color:C.text}}>good</span><br/>
                {"  ]}"}<br/>
                {"}"}
              </div>
            </div>
          </div>
        )}

      {/* ═══ FAULT DESCRIPTION TAB ═══ */}
      {activeTab==="faultdesc"&&(
        <div style={{display:"flex",flexDirection:"column",gap:"20px"}}>

          {/* Live status banner */}
          {faultActive?(
            <div style={{background:C.alarmLight,border:`1px solid ${C.alarm}`,borderRadius:"6px",padding:"14px 20px",display:"flex",alignItems:"center",gap:"12px"}}>
              <div style={{fontSize:"22px"}}>⚡</div>
              <div>
                <div style={{fontWeight:600,color:C.alarm,fontSize:"14px"}}>GUASTO IN CORSO — Schema {scheme} attivo</div>
                <div style={{fontSize:"12px",color:C.textSub,marginTop:"2px"}}>La sequenza di teleprotezione è in esecuzione. Osserva i passi evidenziati nella timeline qui sotto.</div>
              </div>
              <div style={{flex:1}}/>
              <button className="ctrl-btn success" onClick={resetSystem}>↺ Reset</button>
            </div>
          ):(
            <div style={{background:C.okLight,border:`1px solid ${C.ok}55`,borderRadius:"6px",padding:"14px 20px",display:"flex",alignItems:"center",gap:"12px"}}>
              <div style={{fontSize:"22px"}}>✅</div>
              <div>
                <div style={{fontWeight:600,color:C.ok,fontSize:"14px"}}>Sistema in condizioni normali</div>
                <div style={{fontSize:"12px",color:C.textSub,marginTop:"2px"}}>Usa il pulsante <strong>⚡ Inietta Guasto</strong> in alto per avviare una simulazione e vedere la sequenza animarsi in tempo reale.</div>
              </div>
            </div>
          )}

          {/* Animated timeline */}
          <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"6px",padding:"20px"}}>
            <div style={sLbl}>Sequenza di Intervento — Timeline Teleprotezione</div>
            <div style={{position:"relative",paddingLeft:"48px"}}>
              {/* Vertical connector line */}
              <div style={{position:"absolute",left:"19px",top:"24px",bottom:"24px",width:"2px",background:C.border}}/>

              {[
                {
                  step:0, t:"T+0 ms", icon:"⚡", title:"Insorgenza del Guasto",
                  color:C.alarm, lightColor:C.alarmLight,
                  who:"Rete elettrica", std:"IEC 60909",
                  desc:"Un cortocircuito (guasto fase-terra, bifase o trifase) si origina sulla linea di trasmissione. La corrente di guasto supera istantaneamente la corrente nominale di un fattore 5–20×, generando una forte perturbazione nell'impedenza della linea.",
                  detail:"Cause tipiche: fulminazione, flashover di isolatore, contatto accidentale, cedimento meccanico del conduttore. La corrente di cortocircuito può raggiungere decine di kA."
                },
                {
                  step:1, t:"T+20÷50 ms", icon:"📡", title:"Rilevamento da parte dei Relay di Protezione",
                  color:C.warn, lightColor:C.warnLight,
                  who:"Relay PR-1A / PR-2A", std:"IEC 60255 · IEEE C37.113",
                  desc:"I relay di protezione alle due estremità della linea (locale e remoto) misurano continuamente tensione e corrente tramite i trasformatori di misura (TA/TV). Il relay locale rileva l'anomalia di impedenza e porta il proprio stato in PICKUP, avviando il timer di scatto.",
                  detail:"Il relay distanza (21) calcola Z = V/I. Se Z cade nella zona di protezione (Z1 < soglia), scatta immediatamente. Se cade in Z2, avvia un timer e attende il segnale di teleprotezione."
                },
                {
                  step:2, t:"T+50÷80 ms", icon:"📶", title:"Trasmissione del Segnale TPT",
                  color:C.info, lightColor:C.infoLight,
                  who:`TPT-1 → TPT-2 (${scheme})`, std:"IEC 60834-1 · IEC 61850",
                  desc:`L'unità TPT locale codifica e trasmette un segnale di teleprotezione al TPT remoto attraverso il canale di comunicazione (fibra, PLC o radio). Il tipo di segnale dipende dallo schema configurato.`,
                  detail:{
                    POTT:"POTT — il relay locale invia un segnale PERMISSIVO. Il relay remoto scatta SOLO se riceve il permissivo E vede anch'esso il guasto (zona estesa). Protezione più selettiva.",
                    DTT: "DTT — il TPT invia un comando di SCATTO DIRETTO all'interruttore remoto, senza condizioni logiche aggiuntive. Il più veloce, ma richiede canale di comunicazione altamente affidabile.",
                    PUTT:"PUTT — come POTT, ma il relay locale può scattare solo se il guasto è in Zona 1 (zona ridotta). Maggiore sicurezza contro scatti intempestivi.",
                    BLOCK:"BLOCK — in condizioni normali di guasto esterno, TPT-2 invia un segnale di BLOCCO a TPT-1 per inibire lo scatto. Se il blocco non arriva entro il tempo di guardia, TPT-1 scatta."
                  }[scheme]
                },
                {
                  step:3, t:"T+80÷100 ms", icon:"🔁", title:"Ricezione e Logica di Scatto Remoto",
                  color:C.warn, lightColor:C.warnLight,
                  who:"TPT-2 → Relay PR-2A", std:"IEC 60834-1",
                  desc:"Il TPT remoto riceve il segnale, lo verifica (controllo di parità, integrità del canale, latenza) e, se valido, lo trasferisce al relay remoto tramite uscita a relè. Il relay applica la logica dello schema: se le condizioni sono soddisfatte emette il comando di scatto.",
                  detail:"La latenza del canale di comunicazione è critica: su fibra ~2 ms, su PLC ~8–12 ms, su radio ~5–8 ms. Il tempo totale dal guasto allo scatto remoto è tipicamente 60–120 ms per schemi POTT/PUTT."
                },
                {
                  step:4, t:"T+100÷120 ms", icon:"🔴", title:"Apertura degli Interruttori (CB Trip)",
                  color:C.alarm, lightColor:C.alarmLight,
                  who:"CB-A1, CB-B1", std:"IEC 62271-100",
                  desc:"I relay emettono il comando di apertura agli interruttori automatici (circuit breaker) di entrambe le estremità della linea guasta. Gli interruttori, di tipo SF₆ o a vuoto, aprono i poli in circa 40–60 ms, estinguendo l'arco elettrico.",
                  detail:"L'apertura bipolare/tripolare isola fisicamente la linea guasta dalla rete. Il tempo meccanico di apertura dell'interruttore (40–60 ms) si somma al tempo di rilevamento e trasmissione TPT."
                },
                {
                  step:5, t:"T+120÷200 ms", icon:"✅", title:"Isolamento del Guasto e Impatto sull'Utenza",
                  color:C.ok, lightColor:C.okLight,
                  who:"Sistema — Città — Industria", std:"EN 50160 · CEI 0-16",
                  desc:"Il guasto è isolato. Il resto della rete rimane alimentato. I carichi connessi alla sezione isolata (città, industria) subiscono un'interruzione temporanea fino alla riconfigurazione della rete. Il sistema di automazione della sottostazione (SA) avvia le procedure di ripristino.",
                  detail:"Impatto: il polo industriale attiva gli UPS e il load shedding automatico. La città può subire una microcaduta di tensione (dip) di durata < 200 ms. Il relay 79 (richiusura automatica) tenta il ripristino della linea dopo 0.3–3 s se il guasto era transitorio."
                },
              ].map(({step,t,icon,title,color,lightColor,who,std,desc,detail})=>{
                const isActive = faultStep===step;
                const isDone   = faultStep>step;
                const isPending= faultStep<step;
                return (
                  <div key={step} style={{position:"relative",marginBottom:"20px",opacity:isPending&&faultActive?0.45:1,transition:"opacity .4s"}}>
                    {/* Circle on timeline */}
                    <div style={{
                      position:"absolute",left:"-38px",top:"14px",
                      width:"20px",height:"20px",borderRadius:"50%",
                      background:isDone?C.ok:isActive?color:C.bgRow,
                      border:`2px solid ${isDone?C.ok:isActive?color:C.border}`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:"10px",fontWeight:"bold",color:isDone||isActive?"#fff":C.textMuted,
                      zIndex:1,
                      boxShadow: isActive?`0 0 0 4px ${color}22`:"none",
                      transition:"all .4s"
                    }}>
                      {isDone?"✓":step+1}
                    </div>

                    {/* Card */}
                    <div style={{
                      background:isActive?lightColor:C.bgCard,
                      border:`1px solid ${isActive?color:isDone?C.ok+"55":C.border}`,
                      borderLeft:`3px solid ${isDone?C.ok:isActive?color:C.border}`,
                      borderRadius:"6px",padding:"14px 16px",
                      transition:"all .4s"
                    }}>
                      <div style={{display:"flex",alignItems:"flex-start",gap:"12px",marginBottom:"8px"}}>
                        <span style={{fontSize:"20px",lineHeight:1,flexShrink:0,marginTop:"2px"}}>{icon}</span>
                        <div style={{flex:1}}>
                          <div style={{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",marginBottom:"3px"}}>
                            <span style={{fontWeight:600,fontSize:"14px",color:isActive?color:C.text}}>{title}</span>
                            <span style={{background:isActive?color+"22":C.bgRow,border:`1px solid ${isActive?color+"55":C.border}`,color:isActive?color:C.textMuted,fontSize:"10px",padding:"1px 8px",borderRadius:"3px",fontFamily:"'JetBrains Mono',monospace"}}>{t}</span>
                            {isActive&&<span style={{background:color,color:"#fff",fontSize:"10px",padding:"1px 8px",borderRadius:"3px",animation:"blink .8s step-end infinite"}}>IN CORSO</span>}
                            {isDone&&<span style={{background:C.ok+"22",color:C.ok,fontSize:"10px",padding:"1px 8px",borderRadius:"3px"}}>COMPLETATO</span>}
                          </div>
                          <div style={{fontSize:"11px",color:C.textMuted}}>
                            <span style={{color:C.accent,fontWeight:500}}>{who}</span>
                            <span style={{margin:"0 6px",color:C.border}}>·</span>
                            <span>{std}</span>
                          </div>
                        </div>
                      </div>
                      <p style={{margin:"0 0 8px 0",fontSize:"12px",color:C.textSub,lineHeight:"1.65"}}>{desc}</p>
                      <div style={{background:isActive?color+"0d":C.bgRow,border:`1px solid ${isActive?color+"33":C.border}`,borderRadius:"4px",padding:"8px 12px",fontSize:"11px",color:C.textSub,lineHeight:"1.6"}}>
                        <span style={{fontWeight:600,color:isActive?color:C.accent,fontSize:"10px",textTransform:"uppercase",letterSpacing:"1px"}}>Dettaglio tecnico — </span>
                        {detail}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Schema comparison table */}
          <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"6px",padding:"20px"}}>
            <div style={sLbl}>Confronto Schemi di Teleprotezione — IEC 60834-1</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
                <thead>
                  <tr style={{background:C.bgRow}}>
                    {["Schema","Logica di scatto locale","Logica di scatto remoto","Velocità","Selettività","Rischio falso scatto","Uso tipico"].map(h=>(
                      <th key={h} style={{padding:"8px 12px",textAlign:"left",fontWeight:600,fontSize:"10px",textTransform:"uppercase",letterSpacing:"1px",color:C.textMuted,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[
                    {s:"POTT", active:scheme==="POTT", logL:"Pickup Z1/Z2 + Permissivo ricevuto",  logR:"Pickup Z2 + Permissivo ricevuto",    vel:"★★★★☆", sel:"★★★★★", risk:"Basso",    uso:"Linee trasmissione AT standard"},
                    {s:"DTT",  active:scheme==="DTT",  logL:"Pickup Z1",                           logR:"Ricezione comando diretto",           vel:"★★★★★", sel:"★★★☆☆", risk:"Medio",   uso:"Sistemi critici, offshore, HVDC"},
                    {s:"PUTT", active:scheme==="PUTT", logL:"Pickup Z1 + Permissivo ricevuto",     logR:"Pickup Z1 + Permissivo ricevuto",    vel:"★★★☆☆", sel:"★★★★★", risk:"Bassissimo",uso:"Linee con elevata impedenza sorgente"},
                    {s:"BLOCK",active:scheme==="BLOCK",logL:"Pickup Z2 + NO blocco entro Tg",     logR:"Guasto esterno → invia blocco",       vel:"★★★☆☆", sel:"★★★★☆", risk:"Bassissimo",uso:"Reti maglie, linee parallele"},
                  ].map(({s,active,logL,logR,vel,sel,risk,uso})=>(
                    <tr key={s} style={{background:active?C.infoLight:"transparent",borderBottom:`1px solid ${C.bgRow}`}}>
                      <td style={{padding:"8px 12px",fontWeight:600,color:active?C.accent:C.text,whiteSpace:"nowrap"}}>
                        {active&&<span style={{display:"inline-block",width:"6px",height:"6px",borderRadius:"50%",background:C.accent,marginRight:"6px",verticalAlign:"middle"}}/>}
                        {s}
                      </td>
                      <td style={{padding:"8px 12px",color:C.textSub,fontSize:"11px"}}>{logL}</td>
                      <td style={{padding:"8px 12px",color:C.textSub,fontSize:"11px"}}>{logR}</td>
                      <td style={{padding:"8px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",whiteSpace:"nowrap"}}>{vel}</td>
                      <td style={{padding:"8px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",whiteSpace:"nowrap"}}>{sel}</td>
                      <td style={{padding:"8px 12px",color:risk==="Bassissimo"?C.ok:risk==="Basso"?C.ok:risk==="Medio"?C.warn:C.alarm,fontWeight:500,fontSize:"11px"}}>{risk}</td>
                      <td style={{padding:"8px 12px",color:C.textSub,fontSize:"11px"}}>{uso}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Channel failure impact */}
          <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"6px",padding:"20px"}}>
            <div style={sLbl}>Impatto del Canale di Comunicazione sulla Teleprotezione</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"14px",marginBottom:"16px"}}>
              {[
                {type:"FIBER",icon:"◈",lat:"1–5 ms",ber:"10⁻¹²",color:C.ok,
                  pros:["Immunità totale a interferenze EM","Bassissima latenza","BER eccellente","Nessuna diafonia"],
                  cons:["Costo infrastruttura","Vulnerabilità fisica (scavi)","Non sempre disponibile su linee remote"]},
                {type:"PLC",  icon:"⌁",lat:"5–15 ms",ber:"10⁻⁹",color:C.warn,
                  pros:["Usa la linea di potenza stessa","Nessuna infrastruttura separata","Robusto in aree remote"],
                  cons:["Latenza superiore alla fibra","Sensibile a disturbi di rete","Banda limitata (600 bit/s – 4 kbit/s)","BER degradato a frequenze armoniche"]},
                {type:"RADIO",icon:")))))",lat:"3–10 ms",ber:"10⁻⁸",color:C.info,
                  pros:["Economico come backup","Utile su percorsi difficili","Rapida installazione"],
                  cons:["Sensibile a pioggia intensa, neve","Propagazione multi-path","Licenze frequenze","BER peggiore — rischio falsi segnali"]},
              ].map(({type,icon,lat,ber,color,pros,cons})=>(
                <div key={type} style={{background:C.bgRow,border:`1px solid ${color}44`,borderLeft:`3px solid ${color}`,borderRadius:"5px",padding:"14px"}}>
                  <div style={{fontWeight:600,color,fontSize:"13px",marginBottom:"4px"}}>{icon} {type}</div>
                  <div style={{display:"flex",gap:"6px",marginBottom:"10px",fontSize:"10px"}}>
                    <span style={{background:color+"18",border:`1px solid ${color}44`,color,padding:"1px 6px",borderRadius:"3px"}}>Latenza: {lat}</span>
                    <span style={{background:color+"18",border:`1px solid ${color}44`,color,padding:"1px 6px",borderRadius:"3px"}}>BER: {ber}</span>
                  </div>
                  <div style={{marginBottom:"6px"}}>
                    <div style={{fontSize:"10px",fontWeight:600,color:C.ok,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"3px"}}>✓ Vantaggi</div>
                    {pros.map((p,i)=><div key={i} style={{fontSize:"11px",color:C.textSub,padding:"2px 0"}}>• {p}</div>)}
                  </div>
                  <div>
                    <div style={{fontSize:"10px",fontWeight:600,color:C.alarm,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"3px"}}>✗ Svantaggi</div>
                    {cons.map((c,i)=><div key={i} style={{fontSize:"11px",color:C.textSub,padding:"2px 0"}}>• {c}</div>)}
                  </div>
                </div>
              ))}
            </div>
            <div style={{background:C.warnLight,border:`1px solid ${C.warn}55`,borderRadius:"5px",padding:"12px 16px",fontSize:"12px",color:C.textSub,lineHeight:"1.65"}}>
              <span style={{fontWeight:600,color:C.warn}}>⚠ Guasto al canale di comunicazione: </span>
              Se il canale TPT si interrompe durante un guasto, lo schema POTT e PUTT non ricevono il segnale permissivo e i relay remoti scattano solo dopo il tempo di backup (Z2, tipicamente 400–600 ms), causando un intervento più lento. Lo schema BLOCK invece opera "fail-safe": senza segnale di blocco, il relay locale scatta comunque. Il canale di riserva (fibra + PLC o radio) garantisce la continuità del servizio di teleprotezione.
            </div>
          </div>

          {/* Standards box */}
          <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"6px",padding:"20px"}}>
            <div style={sLbl}>Normativa di Riferimento</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:"10px"}}>
              {[
                {std:"IEC 60834-1",       desc:"Teleprotection equipment — Command systems — Part 1: Performance requirements"},
                {std:"IEC 61850",         desc:"Communication networks and systems in substations — GOOSE, MMS, SAMPLED VALUES"},
                {std:"IEC 60255",         desc:"Measuring relays and protection equipment — Relay characteristics"},
                {std:"IEEE C37.94",       desc:"IEEE Standard for N Times 64 Kilobit/s Optical Fiber Interfaces between Teleprotection Equipment and Digital Multiplexer Equipment"},
                {std:"IEC 60909",         desc:"Short-circuit currents in three-phase AC systems — Calculation of currents"},
                {std:"IEC 62271-100",     desc:"High-voltage switchgear and controlgear — AC circuit-breakers"},
                {std:"EN 50160",          desc:"Voltage characteristics of electricity supplied by public electricity networks"},
                {std:"CEI 0-16",          desc:"Regola tecnica di riferimento per la connessione di Utenti attivi e passivi alla rete AT e AAT"},
              ].map(({std,desc})=>(
                <div key={std} style={{background:C.bgRow,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"10px 12px",display:"flex",gap:"10px",alignItems:"flex-start"}}>
                  <div style={{background:C.infoLight,border:`1px solid ${C.accent}33`,color:C.accent,fontWeight:600,fontSize:"10px",padding:"3px 7px",borderRadius:"3px",flexShrink:0,whiteSpace:"nowrap",marginTop:"1px"}}>{std}</div>
                  <div style={{fontSize:"11px",color:C.textSub,lineHeight:"1.5"}}>{desc}</div>
                </div>
              ))}
            </div>
          </div>

        </div>
      )}

      </div>{/* end CONTENT */}

      {/* FOOTER */}
      <div style={{background:C.bgMain,borderTop:`1px solid ${C.border}`,padding:"6px 24px",display:"flex",gap:"16px",fontSize:"10px",color:C.textMuted}}>
        <span>IEC 60834-1 · IEC 61850 · IEEE C37.94</span>
        <span style={{color:C.border}}>|</span>
        <span>Schema: <span style={{color:C.accent,fontWeight:500}}>{scheme}</span></span>
        <span style={{color:C.border}}>|</span>
        <span>Guasto: <span style={{color:faultActive?C.alarm:C.ok,fontWeight:500}}>{faultActive?"ATTIVO":"Nessuno"}</span></span>
        <span style={{color:C.border}}>|</span>
        <span>Produzione: <span style={{color:C.plant,fontWeight:500}}>{fmt(genMW,0)} MW</span></span>
        <span style={{color:C.border}}>|</span>
        <span>Frequenza: <span style={{color:freqOk?C.ok:C.warn,fontWeight:500}}>{fmt(genHz,2)} Hz</span></span>
        <div style={{flex:1}}/>
        <span style={{fontFamily:"'JetBrains Mono',monospace"}}>TPT SIMULATION v3.0 · Tick #{ticker}</span>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(TPTSimulation));

    </script>

</body>
</html>
